databaseChangeLog:
  - changeSet:
      id: 002-create-signal-history
      author: codex
      preConditions:
        - onFail: CONTINUE
        - onError: CONTINUE
        - not:
            - tableExists:
                tableName: signal_history
                schemaName: algo
      changes:
        - createTable:
            tableName: signal_history
            schemaName: algo
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: signal_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: symbol
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: timeframe
                  type: VARCHAR(16)
              - column:
                  name: type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: strength
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: signal_history
            schemaName: algo
            indexName: idx_signal_history_signal_time
            columns:
              - column:
                  name: signal_time

        - addUniqueConstraint:
            tableName: signal_history
            schemaName: algo
            columnNames: source, symbol, timeframe, type, signal_time
            constraintName: uq_signal_history_dedup
