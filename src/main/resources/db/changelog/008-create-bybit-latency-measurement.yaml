databaseChangeLog:
  - changeSet:
      id: 008-create-bybit-latency-measurement
      author: marsel
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        not:
          tableExists:
            schemaName: algo
            tableName: bybit_latency_measurement
      changes:
        - createTable:
            schemaName: algo
            tableName: bybit_latency_measurement
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: run_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: transport
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: signal_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: symbol
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: timeframe
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: candle_open_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: signal_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: detected_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: emitted_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: detection_latency_ms
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: emission_latency_ms
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: VARCHAR(512)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: algo
            tableName: bybit_latency_measurement
            columnNames: run_id, transport, symbol, timeframe, signal_time
            constraintName: uk_bybit_latency_measurement_signal
