databaseChangeLog:
  - changeSet:
      id: 003-add-bybit-api-credentials-to-users
      author: marsel
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        and:
          - not:
              columnExists:
                schemaName: algo
                tableName: app_users
                columnName: bybit_api_key
          - not:
              columnExists:
                schemaName: algo
                tableName: app_users
                columnName: bybit_api_secret
      changes:
        - addColumn:
            schemaName: algo
            tableName: app_users
            columns:
              - column:
                  name: bybit_api_key
                  type: VARCHAR(255)
              - column:
                  name: bybit_api_secret
                  type: VARCHAR(255)