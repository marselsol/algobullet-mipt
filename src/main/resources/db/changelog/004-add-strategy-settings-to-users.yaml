databaseChangeLog:
  - changeSet:
      id: 004-add-strategy-settings-to-users
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        not:
          columnExists:
            schemaName: algo
            tableName: app_users
            columnName: pump_enabled
      changes:
        - addColumn:
            schemaName: algo
            tableName: app_users
            columns:
              - column:
                  name: pump_enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: pump_min_change_percent
                  type: DOUBLE PRECISION
                  defaultValueNumeric: 0.8
                  constraints:
                    nullable: false
              - column:
                  name: pump_timeframe
                  type: VARCHAR(16)
                  defaultValue: "1m"
                  constraints:
                    nullable: false
              - column:
                  name: pump_watchlist
                  type: VARCHAR(4000)
              - column:
                  name: ema_enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: ema_fast
                  type: INT
                  defaultValueNumeric: 9
                  constraints:
                    nullable: false
              - column:
                  name: ema_slow
                  type: INT
                  defaultValueNumeric: 21
                  constraints:
                    nullable: false
              - column:
                  name: ema_timeframe
                  type: VARCHAR(16)
                  defaultValue: "1m"
                  constraints:
                    nullable: false
              - column:
                  name: ema_watchlist
                  type: VARCHAR(4000)
