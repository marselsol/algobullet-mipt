<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} ?: 'ALGOBULLET'">ALGOBULLET</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header>
    <a class="brand" th:href="${#authorization.expression('isAuthenticated()')} ? @{/dashboard} : @{/}">ALGO<span class="bullet">BULLET</span></a>
    <nav>
        <a th:href="@{/pricing}">Тарифы</a>
        <th:block sec:authorize="isAuthenticated()">
            <a th:href="@{/portfolio}">Анализ портфеля</a>
            <a th:href="@{/profile}">Профиль</a>
            <a th:href="@{/settings/pump}">Памп-скринер</a>
            <a th:href="@{/settings/ema}">EMA</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/experiments/bybit-latency}">Latency Exp</a>
            <form th:action="@{/logout}" method="post" class="logout-form logout-form--nav">
                <button type="submit">Выход</button>
            </form>
        </th:block>
        <th:block sec:authorize="isAnonymous()">
            <a th:href="@{/register}">Регистрация</a>
            <a th:href="@{/login}">Войти</a>
        </th:block>
    </nav>
</header>

<main class="container">
    <div th:insert="${content}"></div>
</main>

<footer class="footer">
    <div class="footer__inner">
        <div class="footer__brand">
            <strong>ALGOBULLET</strong>
            <span>Сервис торговых сигналов и аналитики для крипторынка</span>
        </div>
        <div class="footer__links">
            <a th:href="@{/pricing}">Тарифы</a>
            <a th:href="@{/contacts}">Контакты и реквизиты</a>
            <a th:href="@{/legal}">Пользовательское соглашение</a>
        </div>
        <div class="footer__meta">
            <span>ИНН: 182910499540</span>
            <span>© 2025 ALGOBULLET</span>
        </div>
    </div>
</footer>
</body>
</html>
