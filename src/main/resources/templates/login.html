<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::body})}">
<body>
<section class="center auth">
    <div class="panel auth-card">
        <h2>Вход</h2>
        <p class="hint">Введите логин и пароль, чтобы перейти к дашборду ALGOBULLET.</p>
        <form th:action="@{/login}" method="post">
            <div class="form-field">
                <label>Логин</label>
                <input name="username" type="text" autocomplete="username" required>
            </div>
            <div class="form-field">
                <label>Пароль</label>
                <input name="password" type="password" autocomplete="current-password" required>
            </div>
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">
            <div class="auth-actions">
                <button class="btn btn-primary" type="submit">Войти</button>
                <a class="btn btn-secondary" th:href="@{/register}">Регистрация</a>
            </div>
        </form>
        <p class="hint">После входа вы попадёте в рабочую область — дашборд сигналов.</p>
    </div>
</section>
</body>
</html>
